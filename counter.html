<script>
const startDate = new Date("2026-03-29");
const today = new Date();

const diffTime = today - startDate;
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

document.getElementById("days").innerHTML = diffDays + " Days";
</script>
