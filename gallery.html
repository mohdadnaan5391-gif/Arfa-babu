<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Hub Gallery</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f1a;
    color: white;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #1a1a2e;
    font-size: 24px;
    font-weight: bold;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 15px;
    padding: 15px;
  }

  .gallery-item {
    background: #1e1e2f;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
  }

  .gallery-item img {
    width: 100%;
    height: 160px;
    object-fit: cover;
  }

  .gallery-item p {
    margin: 10px;
    font-size: 14px;
  }

</style>
</head>

<body>

<header>🎁 Gift Hub Gallery</header>

<div class="gallery">

  <div class="gallery-item">
    <img src="Screenshot_2026-06-12-11-13-51-44_40deb401b9ffe8e1df2f1cc5ba480b12.jpg" alt="Memory 1">
    <p>Special Memory 1</p>
  </div>

  <div class="gallery-item">
    <img src="IMG-20260611-WA0045.jpg" alt="Memory 2">
    <p>Special Memory 2</p>
  </div>

  <div class="gallery-item">
    <img src="ChatGPT Image Jun 12, 2026, 02_17_47 PM.png" alt="Memory 3">
    <p>Special Memory 3</p>
  </div>

</div>

</body>
</html>
