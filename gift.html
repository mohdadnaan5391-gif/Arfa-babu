<!DOCTYPE html>

<html>
<head>
<title>Gift Box 🎁</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
padding-top:50px;
}

.gift{
font-size:120px;
cursor:pointer;
transition:0.5s;
}

.gift:hover{
transform:scale(1.1);
}

#surprise{
display:none;
background:white;
padding:20px;
margin:20px;
border-radius:20px;
max-width:500px;
margin:auto;
}

a{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#ff4d6d;
color:white;
text-decoration:none;
border-radius:15px;
} </style>

</head>

<body>

<h1>🎁 A Special Gift For Arfa</h1>

<div class="gift" onclick="openGift()">
🎁
</div>

<div id="surprise">
<h2>❤️ Surprise ❤️</h2>
<p>
No gift could ever be more valuable than the moments we share together.
Thank you for being part of my life.
</p>
</div>

<br>

<a href="menu.html">⬅ Back</a>

<script>
function openGift(){
document.getElementById("surprise").style.display="block";
}
</script>

</body>
</html>
