<!DOCTYPE html>
<html>
<head>
<title>Arfa ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
background:#ffebf0;
font-family:Arial;
text-align:center;
padding:20px;
}
h1{
color:#ff1493;
}
.heart{
font-size:60px;
animation:beat 1s infinite;
}
@keyframes beat{
50%{transform:scale(1.2);}
}
.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-top:20px;
}
</style>
</head>
<body>

<div class="heart">❤️</div>

<h1>Welcome Arfa</h1>

<div class="card">
<h2>A Message For You</h2>
<p>
No matter where life takes us, you will always be special to me.
This little website is a place for our memories, photos,
letters and moments together.
</p>
</div>

</body>
</html>
